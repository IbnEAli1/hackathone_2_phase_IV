apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: webapp
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_USER: "user"
  POSTGRES_PASSWORD: "CHANGE-ME-replace-with-a-real-password"
  POSTGRES_DB: "webapp"
